<!DOCTYPE html>
<html>

<head>

<title>უნარები</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#eeeeee;
    margin:0;
    padding:0;
    text-align:center;
}


/* მენიუ */

nav{
    background:#222;
    padding:25px;
    position:relative;
}

nav a{
    color:white;
    margin:15px;
    text-decoration:none;
    font-size:18px;
}

nav a:hover{
    color:#0077ff;
}


/* სათაური */

h1{
    margin-top:10px;
    font-size:45px;
    padding-bottom:15px;
}

h1::after{
    content:"";
    display:block;
    width:100%;
    height:5px;
    background:#0077ff;
    margin-top:15px;
}


/* უნარები */

.container{
    width:70%;
    margin:40px auto;
    text-align:left;
}

.skill{
    margin:25px 0;
}

.skill p{
    font-size:20px;
    margin:5px 0;
}

.bar{
    width:100%;
    background:#ccc;
    height:18px;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#0077ff;
    border-radius:10px;
}

.basketball{width:85%;}
.tabletennis{width:75%;}
.html{width:50%;}
.computer{width:75%;}
.learning{width:95%;}



.photos{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
    flex-wrap:wrap;
}

.photos img{
    width:220px;
    height:220px;        /* ყველა ფოტო ერთ სიმაღლეზე */
    object-fit:cover;    /* არ დაამახინჯებს, უბრალოდ მოაჭრის */
    border-radius:20px;
    border:4px solid #0077ff;
}

</style>

</head>

<body>



<!-- მენიუ -->

<nav>
<a href="my first website.html">🏠</a>


<a href="index.html">მთავარი</a>
<a href="about.html">ჩემ შესახებ</a>
<a href="education.html">განათლება</a>
<a href="skills.html">უნარები</a>
<a href="contact.html">კონტაქტი</a>

</nav>



<h1>ჩემი უნარები</h1>



<div class="container">


<div class="skill">
<p>კალათბურთი</p>
<div class="bar"><div class="fill basketball"></div></div>
</div>


<div class="skill">
<p>მაგიდის ჩოგბურთი</p>
<div class="bar"><div class="fill tabletennis"></div></div>
</div>


<div class="skill">
<p>HTML/CSS</p>
<div class="bar"><div class="fill html"></div></div>
</div>



<div class="skill">
<p>კომპიუტერთან მუშაობა</p>
<div class="bar"><div class="fill computer"></div></div>
</div>


<div class="skill">
<p>სწავლის უნარი / განვითარება</p>
<div class="bar"><div class="fill learning"></div></div>
</div>


</div>

<div class="photos">

    <img src="../lab1/basketball.jpg" alt="ჩემი ფოტო">
    <img src="../lab1/table tennis.jpg" alt="ჩემი ფოტო">

</div>

</body>
</html>
